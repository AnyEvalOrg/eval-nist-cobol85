[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eval-nist-cobol85"
version = "1.0.0"
description = "NIST CCVS85 COBOL to Python conversion with deterministic REPORT equivalence"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = []

[project.optional-dependencies]
# AnyEval requirements give ranges; these are its installed, resolved versions.
inspect = ["inspect_ai==0.3.260"]
anyeval = ["inspect_ai==0.3.260", "inspect-evals==0.19.0", "inspect-k8s-sandbox==0.13.0"]
test = ["inspect_ai==0.3.260", "pytest>=8", "PyYAML>=6", "jsonschema>=4"]

# Inspect task discovery.
[project.entry-points.inspect_ai]
nist_cobol85 = "nist_cobol85"

[tool.setuptools]
packages = ["nist_cobol85"]
include-package-data = true
license-files = ["LICENSE", "NOTICE.md"]

[tool.setuptools.package-data]
nist_cobol85 = ["data/*.gz", "data/*.json", "*.yaml", "Dockerfile", "chart/*.yaml", "chart/templates/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short --basetemp=.build/pytest-tmp"
