services:
  default:
    image: us-central1-docker.pkg.dev/openevalz-sbx-84737/openevalz/eval-livecodebench-sandbox:1.0.0
    build:
      context: .
      dockerfile: Dockerfile
    command: ["sleep", "infinity"]
    working_dir: /tmp
    user: "0:0"
    network_mode: none
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, KILL, CHOWN, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 1.0
    pids_limit: 128
